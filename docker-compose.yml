services:
  backend:
    image: python:3.11
    container_name: environab_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./backend/.env

  frontend:
    image: node:20-alpine
    container_name: environab_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules   
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install &&
             npm run build &&
             npx serve -s build -l 3000"
    depends_on:
      - backend
